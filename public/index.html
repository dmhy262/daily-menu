<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日菜谱 v1.0</title>
  <style>
    /* ==================== 全局样式 ==================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    :root {
      --warm-beige: #FFF8F0;
      --warm-beige-dark: #F5EDE0;
      --soft-blue: #E8F4F8;
      --soft-blue-dark: #D4E8F2;
      --text-primary: #4A4A4A;
      --text-secondary: #7A7A7A;
      --text-light: #A0A0A0;
      --accent-orange: #F0B860;
      --accent-green: #88C687;
      --accent-red: #E78585;
      --white: #FFFFFF;
      --shadow-light: 0 2px 12px rgba(0,0,0,0.04);
      --shadow-medium: 0 4px 20px rgba(0,0,0,0.06);
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, var(--warm-beige) 0%, var(--soft-blue) 100%);
      min-height: 100vh;
      color: var(--text-primary);
      line-height: 1.6;
    }
    
    /* ==================== 容器 ==================== */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    
    /* ==================== 顶部 ==================== */
    .header {
      text-align: center;
      padding: 30px 0;
    }
    
    .header-title {
      font-size: 28px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    
    .header-icon {
      font-size: 32px;
    }
    
    .header-version {
      display: inline-block;
      background: var(--soft-blue-dark);
      color: var(--text-secondary);
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 13px;
      margin-top: 8px;
    }
    
    /* ==================== 导航 ==================== */
    .nav {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }
    
    .nav-btn {
      padding: 12px 28px;
      border: none;
      background: var(--white);
      color: var(--text-secondary);
      border-radius: 14px;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: var(--shadow-light);
      font-weight: 500;
    }
    
    .nav-btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-medium);
    }
    
    .nav-btn.active {
      background: linear-gradient(135deg, var(--soft-blue-dark) 0%, var(--warm-beige-dark) 100%);
      color: var(--text-primary);
    }
    
    /* ==================== 页面切换 ==================== */
    .page {
      display: none;
      animation: fadeIn 0.3s ease;
    }
    
    .page.active {
      display: block;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    /* ==================== 周菜单 - 网格布局 ==================== */
    .week-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }
    
    @media (max-width: 900px) {
      .week-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    
    @media (max-width: 600px) {
      .week-grid {
        grid-template-columns: 1fr;
      }
    }
    
    /* ==================== 天卡片 ==================== */
    .day-card {
      background: var(--white);
      border-radius: 20px;
      padding: 24px;
      box-shadow: var(--shadow-light);
      transition: all 0.3s ease;
    }
    
    .day-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-medium);
    }
    
    .day-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--warm-beige);
    }
    
    .day-name {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
    }
    
    .day-shopping-btn {
      padding: 8px 16px;
      background: linear-gradient(135deg, var(--soft-blue-dark) 0%, var(--soft-blue) 100%);
      border: none;
      border-radius: 10px;
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .day-shopping-btn:hover {
      background: linear-gradient(135deg, var(--accent-orange) 0%, var(--accent-orange) 100%);
      color: var(--white);
    }
    
    /* ==================== 餐品标签 ==================== */
    .recipe-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 14px;
      border-radius: 12px;
      margin: 6px 0;
      font-size: 14px;
      transition: all 0.2s ease;
    }
    
    .recipe-tag:hover {
      transform: translateX(4px);
    }
    
    .tag-meat {
      background: rgba(231, 133, 133, 0.15);
      color: #C75454;
    }
    
    .tag-small-meat {
      background: rgba(240, 184, 96, 0.15);
      color: #C7893C;
    }
    
    .tag-vegetable {
      background: rgba(136, 198, 135, 0.15);
      color: #5C9C5B;
    }
    
    .tag-soup {
      background: rgba(212, 232, 242, 0.6);
      color: #5B8BA6;
    }
    
    .tag-type-icon {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 11px;
      background: white;
    }
    
    .recipe-actions {
      display: flex;
      gap: 8px;
      margin-left: auto;
    }
    
    .mini-btn {
      padding: 6px 10px;
      border: none;
      background: none;
      font-size: 12px;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s ease;
    }
    
    .mini-btn.view {
      color: var(--text-light);
    }
    
    .mini-btn.view:hover {
      background: var(--warm-beige);
      color: var(--text-primary);
    }
    
    .mini-btn.blacklist {
      color: var(--accent-red);
      opacity: 0.6;
    }
    
    .mini-btn.blacklist:hover {
      opacity: 1;
      background: rgba(231, 133, 133, 0.1);
    }
    
    /* ==================== 配置栏 ==================== */
    .config-panel {
      background: var(--white);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-light);
      display: flex;
      align-items: center;
      gap: 24px;
      flex-wrap: wrap;
    }
    
    .config-item {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .config-label {
      font-size: 14px;
      color: var(--text-secondary);
    }
    
    .config-value {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .config-btn {
      width: 32px;
      height: 32px;
      border: none;
      background: var(--warm-beige);
      color: var(--text-primary);
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .config-btn:hover {
      background: var(--warm-beige-dark);
    }
    
    .config-num {
      font-size: 16px;
      font-weight: 600;
      min-width: 24px;
      text-align: center;
    }
    
    .refresh-btn {
      margin-left: auto;
      padding: 12px 28px;
      background: linear-gradient(135deg, var(--accent-orange) 0%, #F3CC89 100%);
      border: none;
      color: white;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(240, 184, 96, 0.3);
    }
    
    .refresh-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(240, 184, 96, 0.4);
    }
    
    /* ==================== 购物清单 ==================== */
    .shopping-card {
      background: var(--white);
      border-radius: 20px;
      box-shadow: var(--shadow-light);
      overflow: hidden;
    }
    
    .shopping-header {
      background: linear-gradient(135deg, var(--soft-blue-dark) 0%, var(--warm-beige-dark) 100%);
      padding: 24px;
      color: var(--text-primary);
    }
    
    .shopping-title {
      font-size: 20px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .shopping-subtitle {
      margin-top: 6px;
      font-size: 14px;
      color: var(--text-secondary);
    }
    
    .shopping-count {
      margin-top: 10px;
      font-size: 13px;
      color: var(--text-secondary);
    }
    
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border: none;
      background: var(--warm-beige);
      color: var(--text-primary);
      border-radius: 12px;
      font-size: 14px;
      cursor: pointer;
      margin-bottom: 20px;
      transition: all 0.2s ease;
    }
    
    .back-btn:hover {
      background: var(--warm-beige-dark);
    }
    
    .shopping-body {
      padding: 24px;
    }
    
    .category-section {
      margin-bottom: 28px;
    }
    
    .category-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--warm-beige);
    }
    
    .shopping-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 0;
      border-bottom: 1px solid var(--warm-beige);
      transition: all 0.2s ease;
    }
    
    .shopping-item:last-child {
      border-bottom: none;
    }
    
    .check-btn {
      width: 24px;
      height: 24px;
      border: 2px solid var(--text-light);
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    
    .check-btn.checked {
      background: var(--accent-green);
      border-color: var(--accent-green);
    }
    
    .check-btn.checked::after {
      content: '✓';
      color: white;
      font-size: 14px;
      font-weight: bold;
    }
    
    .item-name {
      flex: 1;
      font-size: 15px;
    }
    
    .shopping-item.purchased .item-name {
      color: var(--text-light);
      text-decoration: line-through;
    }
    
    .item-qty {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: var(--text-secondary);
    }
    
    .qty-btn {
      width: 28px;
      height: 28px;
      border: none;
      background: var(--soft-blue);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 16px;
    }
    
    .qty-btn:hover {
      background: var(--soft-blue-dark);
    }
    
    .delete-btn {
      width: 28px;
      height: 28px;
      border: none;
      background: none;
      color: var(--text-light);
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s ease;
    }
    
    .delete-btn:hover {
      background: rgba(231, 133, 133, 0.1);
      color: var(--accent-red);
    }
    
    /* ==================== 菜谱管理 ==================== */
    .recipe-manage-header {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    
    .action-btn {
      padding: 14px 24px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .btn-green {
      background: linear-gradient(135deg, var(--accent-green) 0%, #A8D9A8 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(136, 198, 135, 0.3);
    }
    
    .btn-green:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(136, 198, 135, 0.4);
    }
    
    .btn-blue {
      background: linear-gradient(135deg, var(--soft-blue-dark) 0%, var(--soft-blue) 100%);
      color: var(--text-primary);
    }
    
    .btn-blue:hover {
      transform: translateY(-2px);
    }
    
    .btn-red {
      background: rgba(231, 133, 133, 0.15);
      color: var(--accent-red);
      margin-left: auto;
    }
    
    .btn-red:hover {
      background: rgba(231, 133, 133, 0.25);
    }
    
    .recipe-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }
    
    .recipe-card {
      background: var(--white);
      border-radius: 18px;
      padding: 20px;
      box-shadow: var(--shadow-light);
      transition: all 0.3s ease;
    }
    
    .recipe-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-medium);
    }
    
    .recipe-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    
    .recipe-name {
      font-size: 17px;
      font-weight: 600;
    }
    
    .recipe-type-badge {
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 8px;
      font-weight: 500;
    }
    
    .recipe-details {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 14px;
    }
    
    .recipe-detail-line {
      margin: 4px 0;
    }
    
    .recipe-card-actions {
      display: flex;
      gap: 8px;
      padding-top: 12px;
      border-top: 1px solid var(--warm-beige);
    }
    
    .recipe-card-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .recipe-card-btn.view-recipe {
      background: var(--soft-blue);
      color: var(--text-primary);
    }
    
    .recipe-card-btn.view-recipe:hover {
      background: var(--soft-blue-dark);
    }
    
    .recipe-card-btn.blacklist-recipe {
      background: rgba(231, 133, 133, 0.1);
      color: var(--accent-red);
    }
    
    .recipe-card-btn.blacklist-recipe:hover {
      background: rgba(231, 133, 133, 0.2);
    }
    
    /* ==================== 模态框 ==================== */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }
    
    .modal-overlay.active {
      display: flex;
    }
    
    .modal {
      background: var(--white);
      border-radius: 24px;
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
      animation: slideUp 0.3s ease;
    }
    
    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .modal-header {
      padding: 24px;
      border-bottom: 1px solid var(--warm-beige);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .modal-title {
      font-size: 20px;
      font-weight: 600;
    }
    
    .modal-close {
      width: 36px;
      height: 36px;
      border: none;
      background: var(--warm-beige);
      border-radius: 10px;
      cursor: pointer;
      font-size: 18px;
      transition: all 0.2s ease;
    }
    
    .modal-close:hover {
      background: var(--warm-beige-dark);
    }
    
    .modal-body {
      padding: 24px;
    }
    
    /* ==================== 表单 ==================== */
    .form-group {
      margin-bottom: 20px;
    }
    
    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 8px;
    }
    
    .form-input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--warm-beige-dark);
      border-radius: 12px;
      font-size: 15px;
      transition: all 0.2s ease;
      outline: none;
    }
    
    .form-input:focus {
      border-color: var(--accent-orange);
      box-shadow: 0 0 0 3px rgba(240, 184, 96, 0.15);
    }
    
    .form-textarea {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--warm-beige-dark);
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.6;
      outline: none;
      resize: vertical;
      min-height: 120px;
    }
    
    .form-textarea:focus {
      border-color: var(--accent-orange);
      box-shadow: 0 0 0 3px rgba(240, 184, 96, 0.15);
    }
    
    .form-row {
      display: flex;
      gap: 12px;
    }
    
    .form-row .form-group {
      flex: 1;
    }
    
    .ai-btn {
      margin-left: 10px;
      padding: 10px 16px;
      background: linear-gradient(135deg, var(--accent-orange) 0%, #F3CC89 100%);
      border: none;
      color: white;
      border-radius: 10px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .ai-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(240, 184, 96, 0.4);
    }
    
    .ai-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    
    .modal-footer {
      padding: 20px 24px;
      border-top: 1px solid var(--warm-beige);
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }
    
    .btn-cancel {
      padding: 12px 24px;
      border: none;
      background: var(--warm-beige);
      color: var(--text-primary);
      border-radius: 12px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .btn-cancel:hover {
      background: var(--warm-beige-dark);
    }
    
    .btn-confirm {
      padding: 12px 24px;
      border: none;
      background: linear-gradient(135deg, var(--accent-orange) 0%, #F3CC89 100%);
      color: white;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .btn-confirm:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(240, 184, 96, 0.4);
    }
    
    /* ==================== 查看菜谱详情 ==================== */
    .detail-section-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
      margin: 16px 0 8px 0;
    }
    
    .detail-list {
      padding-left: 20px;
      color: var(--text-primary);
      font-size: 14px;
    }
    
    .detail-list li {
      margin: 6px 0;
    }
    
    .detail-info-line {
      font-size: 14px;
      color: var(--text-secondary);
      margin: 6px 0;
    }
    
    /* ==================== 批量导入进度 ==================== */
    .progress-container {
      margin-top: 20px;
    }
    
    .progress-bar {
      height: 8px;
      background: var(--warm-beige);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-orange), #F3CC89);
      border-radius: 10px;
      transition: width 0.3s ease;
    }
    
    .progress-text {
      font-size: 13px;
      color: var(--text-secondary);
    }
    
    .import-status-list {
      margin-top: 16px;
      max-height: 200px;
      overflow-y: auto;
    }
    
    .import-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--warm-beige);
      font-size: 14px;
    }
    
    .import-item.success {
      color: var(--accent-green);
    }
    
    .import-item.error {
      color: var(--accent-red);
    }
    
    /* ==================== 响应式微调 ==================== */
    @media (max-width: 600px) {
      .config-panel {
        flex-direction: column;
        align-items: flex-start;
      }
      
      .refresh-btn {
        width: 100%;
        margin-left: 0;
      }
      
      .recipe-manage-header {
        flex-direction: column;
      }
      
      .btn-red {
        margin-left: 0;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 顶部 -->
    <header class="header">
      <div class="header-title">
        <span class="header-icon">🍳</span>
        每日菜谱
      </div>
      <div class="header-version">v1.0</div>
    </header>

    <!-- 导航 -->
    <nav class="nav">
      <button class="nav-btn active" data-page="week">📅 周菜谱</button>
      <button class="nav-btn" data-page="recipes">📖 菜谱管理</button>
      <button class="nav-btn" data-page="shopping">🛒 购物清单</button>
    </nav>

    <!-- ================ 页面1: 周菜谱 ================ -->
    <div class="page active" id="page-week">
      <!-- 配置栏 -->
      <div class="config-panel">
        <div class="config-item">
          <span class="config-label">成人</span>
          <div class="config-value">

      <!-- 周菜单网格 -->

    <!-- ================ 页面2: 购物清单 ================ -->
    <div class="page" id="page-shopping">
      <div id="shopping-back-btn-container"></div>
      <div class="shopping-card">
        <div class="shopping-header">
          <div class="shopping-title" id="shopping-title">🛒 本周购物清单</div>

          <div class="shopping-count" id="shopping-count"></div>
        </div>
        <div class="shopping-body" id="shopping-body">
          <!-- 动态渲染 -->
        </div>

    <!-- ================ 页面3: 菜谱管理 ================ -->
    <div class="page" id="page-recipes">
      <div class="recipe-manage-header">
        <button class="action-btn btn-green" id="btn-add-recipe">
          ➕ 添加菜谱
        </button>
        <button class="action-btn btn-blue" id="btn-batch-import">
          📥 批量导入
        </button>

          🗑️ 清除所有
        </button>

        <!-- 动态渲染 -->
      </div>

  <!-- ================ 模态框: 添加菜谱 ================ -->
  <div class="modal-overlay" id="modal-add">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">添加菜谱</h3>
        <button class="modal-close" id="modal-add-close">×</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <div style="display: flex; align-items: center;">
            <label class="form-label">菜谱名称</label>
            <button class="ai-btn" id="ai-generate-btn">✨ AI生成</button>
          </div>
          <input type="text" class="form-input" id="recipe-name" placeholder="例如：宫保鸡丁">
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">烹饪时间</label>
            <input type="text" class="form-input" id="recipe-time" placeholder="例如：30分钟">
          </div>
          <div class="form-group">
            <label class="form-label">难度</label>
            <input type="text" class="form-input" id="recipe-difficulty" placeholder="简单/中等/困难">

        <div class="form-group">
          <label class="form-label">食材（每行一个）</label>
          <textarea class="form-textarea" id="recipe-ingredients" placeholder="鸡胸肉 200g&#10;花生 50g&#10;辣椒 适量"></textarea>
        </div>
        
        <div class="form-group">
          <label class="form-label">步骤（每行一个）</label>
          <textarea class="form-textarea" id="recipe-steps" placeholder="准备食材&#10;腌制鸡胸肉&#10;炒制"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" id="add-cancel">取消</button>
        <button class="btn-confirm" id="add-confirm">添加</button>
      </div>
    </div>
  </div>

  <!-- ================ 模态框: 查看菜谱 ================ -->
  <div class="modal-overlay" id="modal-view">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title" id="view-recipe-name">菜谱详情</h3>
        <button class="modal-close" id="modal-view-close">×</button>
      </div>
      <div class="modal-body" id="view-recipe-body">
        <!-- 动态渲染 -->
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" id="view-close">关闭</button>
      </div>
    </div>
  </div>

  <!-- ================ 模态框: 批量导入 ================ -->
  <div class="modal-overlay" id="modal-batch">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">批量导入菜谱</h3>
        <button class="modal-close" id="modal-batch-close">×</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">菜谱列表（每行一个菜名）</label>
          <textarea class="form-textarea" id="batch-recipes" placeholder="鱼香肉丝&#10;宫保鸡丁&#10;红烧肉"></textarea>
        </div>
        
        <div class="progress-container" id="batch-progress-container" style="display: none;">
          <div class="progress-bar">
            <div class="progress-fill" id="batch-progress" style="width:0%"></div>
          </div>
          <div class="progress-text" id="batch-progress-text">正在导入...</div>
          <div class="import-status-list" id="batch-status-list"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" id="batch-cancel">取消</button>
        <button class="btn-confirm" id="batch-confirm">开始导入</button>
      </div>
    </div>
  </div>

  <!-- ================ 模态框: 确认 ================ -->
  <div class="modal-overlay" id="modal-confirm">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">确认操作</h3>
        <button class="modal-close" id="modal-confirm-close">×</button>
      </div>
      <div class="modal-body" id="confirm-body">
        确认要执行此操作吗？
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" id="confirm-cancel">取消</button>
        <button class="btn-confirm" id="confirm-ok">确定</button>
      </div>
    </div>
  </div>

  <script>
    // ==================== 全局状态 ====================
    let state = {
      recipes: [],
      blacklistedIds: [],
      config: { adults: 2, children: 0 },
      weekMenu: [],
      selectedDay: null,
      purchasedItems: {}
    };
    
    const API_BASE = '';
    
    // ==================== 初始化 ====================
    document.addEventListener('DOMContentLoaded', async () => {
      await loadAllData();
      bindEvents();
      renderWeekMenu();
    });
    
    // ==================== 数据加载 ====================
    async function loadAllData() {
      try {
        const res = await fetch(API_BASE + '/api/data');
        const data = await res.json();
        state.recipes = data.recipes || [];
        state.blacklistedIds = data.blacklistedIds || [];
        state.config = data.config || { adults: 2, children: 0 };
        state.weekMenu = data.weekMenu || [];
        
        updateConfigDisplay();
        
        if (state.weekMenu.length === 0 && state.recipes.length > 0) {
          regenerateWeekMenu();
        }
      } catch (e) {
        console.error('加载失败:', e);
      }
    }
    
    async function saveData() {
      await fetch(API_BASE + '/api/data', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          recipes: state.recipes,
          blacklistedIds: state.blacklistedIds,
          config: state.config,
          weekMenu: state.weekMenu
        })
      });
    }
    
    // ==================== 事件绑定 ====================
    function bindEvents() {
      // 导航
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          
          const page = btn.dataset.page;
          document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
          if (page === 'week') {
            document.getElementById('page-week').classList.add('active');
            renderWeekMenu();
          } else if (page === 'recipes') {
            document.getElementById('page-recipes').classList.add('active');
            renderRecipeList();
          } else if (page === 'shopping') {
            document.getElementById('page-shopping').classList.add('active');
            renderShoppingList();
          }
        });
      });
      
      // 配置
      document.getElementById('adult-plus').addEventListener('click', () => {
        state.config.adults = Math.min(10, state.config.adults + 1);
        updateConfigDisplay();
        saveData();
      });
      document.getElementById('adult-minus').addEventListener('click', () => {
        state.config.adults = Math.max(1, state.config.adults - 1);
        updateConfigDisplay();
        saveData();
      });
      document.getElementById('child-plus').addEventListener('click', () => {
        state.config.children = Math.min(10, state.config.children + 1);
        updateConfigDisplay();
        saveData();
      });
      document.getElementById('child-minus').addEventListener('click', () => {
        state.config.children = Math.max(0, state.config.children - 1);
        updateConfigDisplay();
        saveData();
      });
      
      // 重新生成
      document.getElementById('refresh-menu').addEventListener('click', regenerateWeekMenu);
      
      // 按钮
      document.getElementById('btn-add-recipe').addEventListener('click', openAddModal);
      document.getElementById('btn-batch-import').addEventListener('click', openBatchModal);
      document.getElementById('btn-clear-all').addEventListener('click', clearAllRecipes);
      
      // 模态框关闭
      ['modal-add-close','modal-view-close','modal-batch-close','modal-confirm-close','add-cancel','view-close','batch-cancel','confirm-cancel'].forEach(id => {
        const el = document.getElementById(id);
        if (el) {
          el.addEventListener('click', () => {
            el.closest('.modal-overlay').classList.remove('active');
          });
        }
      });
      
      // 关闭模态框点击背景
      document.querySelectorAll('.modal-overlay').forEach(overlay => {
        overlay.addEventListener('click', (e) => {
          if (e.target === overlay) {
            overlay.classList.remove('active');
          }
        });
      });
      
      // 添加确认
      document.getElementById('add-confirm').addEventListener('click', addRecipe);
      
      // AI生成
      document.getElementById('ai-generate-btn').addEventListener('click', generateRecipeWithAI);
    }
    
    function updateConfigDisplay() {
      document.getElementById('adult-num').textContent = state.config.adults;
      document.getElementById('child-num').textContent = state.config.children;
    }
    
    // ==================== 生成周菜单 ====================
    const categories = ['荤菜', '小荤', '蔬菜', '汤'];
    const weekNames = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
    
    function regenerateWeekMenu() {
      const availableRecipes = state.recipes.filter(r => !state.blacklistedIds.includes(r.id));
      
      // 分类
      const recipesByType = {};
      categories.forEach(cat => {
        recipesByType[cat] = availableRecipes.filter(r => r.type === cat);
      });
      
      // 每次都重置
      const usedRecipeIdsByType = {};
      categories.forEach(cat => {
        usedRecipeIdsByType[cat] = [];
      });
      
      function getRandomRecipe(list, type) {
        if (!list || list.length === 0) return null;
        const used = usedRecipeIdsByType[type] || [];
        let available = list.filter(r => r && r.id && !used.includes(r.id));
        
        if (available.length > 0) {
          const shuffled = [...available].sort(() => Math.random() - 0.5);
          const selected = shuffled[0];
          if (selected && selected.id) {
            usedRecipeIdsByType[type].push(selected.id);
          }
          return selected;
        }
        
        // 重置
        usedRecipeIdsByType[type] = [];
        const all = list.filter(r => r && r.id).sort(() => Math.random() - 0.5);
        if (all.length > 0) {
          const selected = all[0];
          usedRecipeIdsByType[type].push(selected.id);
          return selected;
        }
        return null;
      }
      
      const result = [];
      
      for (let i = 0; i < 7; i++) {
        const dayMenu = {
          id: weekNames[i],
          name: weekNames[i],
          dinner: []
        };
        
        const meat = getRandomRecipe(recipesByType['荤菜'], '荤菜');
        if (meat) dayMenu.dinner.push({ recipe: meat, portion: '荤菜' });
        
        const small = getRandomRecipe(recipesByType['小荤'], '小荤');
        if (small) dayMenu.dinner.push({ recipe: small, portion: '小荤' });
        
        const veg = getRandomRecipe(recipesByType['蔬菜'], '蔬菜');
        if (veg) dayMenu.dinner.push({ recipe: veg, portion: '蔬菜' });
        
        const soup = getRandomRecipe(recipesByType['汤'], '汤');
        if (soup) dayMenu.dinner.push({ recipe: soup, portion: '汤' });
        
        result.push(dayMenu);
      }
      
      state.weekMenu = result;
      state.selectedDay = null;
      saveData();
      renderWeekMenu();
    }
    
    // ==================== 渲染周菜单 ====================
    function renderWeekMenu() {
      const grid = document.getElementById('week-grid');
      grid.innerHTML = state.weekMenu.map(day => `
        <div class="day-card">
          <div class="day-header">
            <div class="day-name">${day.name}</div>
            <button class="day-shopping-btn" onclick="goToShoppingForDay('${day.name}')">
              🛒 购物清单
            </button>
          </div>
          <div>
            ${day.dinner.map(item => renderRecipeTag(item.recipe)).join('')}
            ${day.dinner.length === 0 ? '<div style="color: var(--text-light); font-size:14px; padding:10px 0;">暂无菜谱，请先添加！</div>' : ''}
          </div>
        </div>
      `).join('');
    }
    
    function renderRecipeTag(recipe) {
      let typeClass = 'tag-vegetable', iconChar = '蔬';
      if (recipe.type === '荤菜') { typeClass = 'tag-meat'; iconChar = '肉'; }
      else if (recipe.type === '小荤') { typeClass = 'tag-small-meat'; iconChar = '小'; }
      else if (recipe.type === '汤') { typeClass = 'tag-soup'; iconChar = '汤'; }
      
      return `
        <div class="recipe-tag ${typeClass}">
          <span class="tag-type-icon">${iconChar}</span>
          <span>${recipe.name}</span>
          <div class="recipe-actions">
            <button class="mini-btn view" onclick="viewRecipeDetail(${recipe.id})">详情</button>
            <button class="mini-btn blacklist" onclick="blacklistRecipe(${recipe.id})">拉黑</button>
          </div>
        </div>
      `;
    }
    
    function goToShoppingForDay(dayName) {
      const day = state.weekMenu.find(d => d.name === dayName);
      if (day) {
        state.selectedDay = day;
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById('page-shopping').classList.add('active');
        renderShoppingList();
      }
    }
    
    // ==================== 渲染购物清单 ====================
    function renderShoppingList() {
      const titleEl = document.getElementById('shopping-title');
      const subtitleEl = document.getElementById('shopping-subtitle');
      const bodyEl = document.getElementById('shopping-body');
      const backBtnContainer = document.getElementById('shopping-back-btn-container');
      
      if (state.selectedDay) {
        titleEl.innerHTML = `🛒 ${state.selectedDay.name}购物清单`;
        subtitleEl.textContent = `${state.selectedDay.dinner?.length || 0}道菜`;
        backBtnContainer.innerHTML = `
          <button class="back-btn" onclick="goBackToAllShopping()">← 返回本周购物清单</button>
        `;
      } else {
        titleEl.innerHTML = '🛒 本周购物清单';
        const total = state.weekMenu.reduce((sum, day) => sum + (day.dinner?.length || 0), 0);
        subtitleEl.textContent = `共 ${total} 道菜`;
        backBtnContainer.innerHTML = '';
      }
      
      const days = state.selectedDay ? [state.selectedDay] : state.weekMenu;
      const ingredients = [];
      
      days.forEach(day => {
        if (day.dinner) {
          day.dinner.forEach(item => {
            if (item.recipe && item.recipe.ingredients) {
              item.recipe.ingredients.forEach(ing => {
                const [name, qty] = ing.split(/(\d+\.?\d*)/).filter(Boolean);
                const cleanName = name ? name.trim() : ing.trim();
                const existing = ingredients.find(i => i.name === cleanName);
                if (existing) {
                  existing.quantity = (parseFloat(existing.quantity) || 1) + (parseFloat(qty) || 1);
                } else {
                  ingredients.push({
                    id: Date.now() + Math.random(),
                    name: cleanName,
                    quantity: parseFloat(qty) || 1,
                    unit: cleanName ? ing.replace(cleanName, '').replace(qty || '', '').trim() || '个' : '个',
                    purchased: state.purchasedItems[cleanName] || false
                  });
                }
              });
            }
          });
        }
      });
      
      const purchased = ingredients.filter(i => i.purchased).length;
      document.getElementById('shopping-count').textContent = `${purchased}/${ingredients.length} 已购`;
      
      const categories = {
        '蔬菜': ingredients.filter(i => ['番茄', '青菜', '黄瓜', '胡萝卜', '土豆', '西兰花', '青椒', '木耳', '白菜', '菠菜', '芹菜', '蘑菇', '茄子', '冬瓜', '丝瓜', '南瓜', '藕'].some(k => i.name.includes(k))),
        '肉类': ingredients.filter(i => ['肉', '排骨', '牛腩', '鸡', '鱼', '虾', '牛肉', '猪肉', '羊肉', '火腿', '鸭'].some(k => i.name.includes(k))),
        '蛋类/豆制品': ingredients.filter(i => ['鸡蛋', '豆腐', '豆皮', '豆干', '鸭蛋'].some(k => i.name.includes(k))),
        '调料/其他': ingredients.filter(i => !['番茄', '青菜', '黄瓜', '胡萝卜', '土豆', '西兰花', '青椒', '木耳', '白菜', '菠菜', '芹菜', '蘑菇', '茄子', '冬瓜', '丝瓜', '南瓜', '藕', '肉', '排骨', '牛腩', '鸡', '鱼', '虾', '牛肉', '猪肉', '羊肉', '火腿', '鸭', '鸡蛋', '豆腐', '豆皮', '豆干', '鸭蛋'].some(k => i.name.includes(k)))
      };
      
      bodyEl.innerHTML = Object.entries(categories).map(([cat, items]) => {
        if (items.length === 0) return '';
        return `
          <div class="category-section">
            <div class="category-title">${cat}</div>
            ${items.map(item => `
              <div class="shopping-item ${item.purchased ? 'purchased' : ''}">
                <button class="check-btn ${item.purchased ? 'checked' : ''}" 
                        onclick="togglePurchased('${item.name}')"></button>
                <div class="item-name">${item.name}</div>
                <div class="item-qty">
                  <button class="qty-btn" onclick="updateQty('${item.name}', -0.5)">-</button>
                  <span>${item.quantity} ${item.unit}</span>
                  <button class="qty-btn" onclick="updateQty('${item.name}', 0.5)">+</button>
                </div>
                <button class="delete-btn" onclick="removeItem('${item.name}')">×</button>
              </div>
            `).join('')}
          </div>
        `;
      }).join('');
    }
    
    function goBackToAllShopping() {
      state.selectedDay = null;
      renderShoppingList();
    }
    
    function togglePurchased(name) {
      state.purchasedItems[name] = !state.purchasedItems[name];
      renderShoppingList();
    }
    
    function updateQty(name, delta) {
      // 这里简单实现，不修改原始菜谱
      renderShoppingList();
    }
    
    function removeItem(name) {
      // 简单实现
      renderShoppingList();
    }
    
    // ==================== 菜谱管理 ====================
    function renderRecipeList() {
      const grid = document.getElementById('recipe-grid');
      
      if (state.recipes.length === 0) {
        grid.innerHTML = `
          <div style="grid-column: 1/-1; text-align:center; padding:60px 20px; color:var(--text-light); font-size:16px;">
            还没有菜谱，快添加一些吧！
          </div>
        `;
        return;
      }
      
      grid.innerHTML = state.recipes.map(r => {
        let typeClass = 'tag-vegetable';
        if (r.type === '荤菜') typeClass = 'tag-meat';
        else if (r.type === '小荤') typeClass = 'tag-small-meat';
        else if (r.type === '汤') typeClass = 'tag-soup';
        
        const isBlacklisted = state.blacklistedIds.includes(r.id);
        
        return `
          <div class="recipe-card">
            <div class="recipe-card-header">
              <div class="recipe-name">${r.name}</div>
              <div class="recipe-type-badge ${typeClass}" style="font-size:12px; padding:4px 10px; border-radius:8px;">${r.type}</div>
            </div>
            <div class="recipe-details">
              <div class="recipe-detail-line">⏱️ ${r.time || '30分钟'}</div>
              <div class="recipe-detail-line">📊 ${r.difficulty || '简单'}</div>
              ${isBlacklisted ? '<div class="recipe-detail-line" style="color:var(--accent-red);">🚫 已拉黑</div>' : ''}
            </div>
            <div class="recipe-card-actions">
              <button class="recipe-card-btn view-recipe" onclick="viewRecipeDetail(${r.id})">查看详情</button>
              <button class="recipe-card-btn blacklist-recipe" onclick="${isBlacklisted ? `unblacklistRecipe(${r.id})` : `blacklistRecipe(${r.id})`}">
                ${isBlacklisted ? '取消拉黑' : '拉黑'}
              </button>
              <button class="recipe-card-btn blacklist-recipe" onclick="deleteRecipe(${r.id})" style="background:transparent; border:1px solid var(--warm-beige-dark);">删除</button>
            </div>
          </div>
        `;
      }).join('');
    }
    
    // ==================== 添加菜谱 ====================
    let editingId = null;
    
    function openAddModal() {
      editingId = null;
      document.getElementById('recipe-name').value = '';
      document.getElementById('recipe-time').value = '';
      document.getElementById('recipe-difficulty').value = '';
      document.getElementById('recipe-ingredients').value = '';
      document.getElementById('recipe-steps').value = '';
      document.getElementById('modal-add').classList.add('active');
    }
    
    async function addRecipe() {
      const name = document.getElementById('recipe-name').value.trim();
      if (!name) { alert('请输入菜名'); return; }
      
      const ingredientsText = document.getElementById('recipe-ingredients').value.trim();
      const stepsText = document.getElementById('recipe-steps').value.trim();
      
      const ingredients = ingredientsText ? ingredientsText.split('\n').map(l => l.trim()).filter(l => l) : ['主料 适量','辅料 适量'];
      const steps = stepsText ? stepsText.split('\n').map(l => l.trim()).filter(l => l) : ['准备食材','按常规方法烹饪','调味出锅'];
      
      const newRecipe = {
        id: Date.now(),
        name,
        type: getDishCategory(name),
        time: document.getElementById('recipe-time').value || '30分钟',
        difficulty: document.getElementById('recipe-difficulty').value || '简单',
        ingredients,
        steps
      };
      
      state.recipes.push(newRecipe);
      await saveData();
      document.getElementById('modal-add').classList.remove('active');
      renderRecipeList();
    }
    
    function getDishCategory(name) {
      if (/汤|羹|粥|煲/.test(name)) return '汤';
      if (/鸡蛋|豆腐|虾仁|肉丁|肉丝|鸡丁|肉末|肉丸|火腿肠/.test(name)) return '小荤';
      if (/排骨|鱼|鸡|鸭|牛|羊|肉|虾|蟹|翅|腿|胸|牛腩|牛肉|羊肉|猪肉|鱼片|鸡丁|红烧肉/.test(name)) return '荤菜';
      if (/菜|青|蔬|瓜|豆|茄|笋|菇|芋|藕|萝卜|土豆|地瓜|山药|青菜|白菜|菠菜|生菜|茼蒿/.test(name)) return '蔬菜';
      return '小荤';
    }
    
    // ==================== AI生成 ====================
    async function generateRecipeWithAI() {
      const name = document.getElementById('recipe-name').value.trim();
      if (!name) { alert('请先输入菜名！'); return; }
      
      const btn = document.getElementById('ai-generate-btn');
      btn.disabled = true;
      btn.textContent = '生成中...';
      
      try {
        const res = await fetch(API_BASE + '/api/ai/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name })
        });
        
        const data = await res.json();
        if (data && data.recipe) {
          document.getElementById('recipe-time').value = data.recipe.time || '30分钟';
          document.getElementById('recipe-difficulty').value = data.recipe.difficulty || '简单';
          document.getElementById('recipe-ingredients').value = data.recipe.ingredients.join('\n');
          document.getElementById('recipe-steps').value = data.recipe.steps.join('\n');
        }
      } catch (e) {
        console.error('生成失败:', e);
        alert('AI生成失败，请稍后重试或手动填写！');
      }
      
      btn.disabled = false;
      btn.textContent = '✨ AI生成';
    }
    
    // ==================== 批量导入 ====================
    async function openBatchModal() {
      document.getElementById('batch-recipes').value = '';
      document.getElementById('batch-progress-container').style.display = 'none';
      document.getElementById('batch-status-list').innerHTML = '';
      document.getElementById('batch-progress').style.width = '0%';
      document.getElementById('modal-batch').classList.add('active');
      
      document.getElementById('batch-confirm').onclick = startBatchImport;
    }
    
    async function startBatchImport() {
      const text = document.getElementById('batch-recipes').value.trim();
      if (!text) { alert('请输入菜名！'); return; }
      
      const lines = text.split('\n').map(l => l.trim()).filter(l => l);
      if (lines.length === 0) { alert('请输入菜名！'); return; }
      
      const btn = document.getElementById('batch-confirm');
      btn.disabled = true;
      document.getElementById('batch-progress-container').style.display = 'block';
      document.getElementById('batch-status-list').innerHTML = '';
      
      let success = 0, fail = 0;
      
      for (let i = 0; i < lines.length; i++) {
        const name = lines[i];
        const statusDiv = document.createElement('div');
        statusDiv.className = 'import-item';
        statusDiv.textContent = name;
        document.getElementById('batch-status-list').appendChild(statusDiv);
        
        try {
          const res = await fetch(API_BASE + '/api/ai/generate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name })
          });
          
          const data = await res.json();
          if (data && data.recipe) {
            const newRecipe = {
              id: Date.now() + i,
              name: data.recipe.name,
              type: getDishCategory(data.recipe.name),
              time: data.recipe.time || '30分钟',
              difficulty: data.recipe.difficulty || '简单',
              ingredients: data.recipe.ingredients,
              steps: data.recipe.steps
            };
            
            state.recipes.push(newRecipe);
            statusDiv.className += ' success';
            statusDiv.textContent = `${name} ✓`;
            success++;
          } else {
            throw new Error('失败');
          }
        } catch (e) {
          statusDiv.className += ' error';
          statusDiv.textContent = `${name} ✗`;
          fail++;
        }
        
        const progress = Math.round(((i + 1) / lines.length) * 100);
        document.getElementById('batch-progress').style.width = progress + '%';
        document.getElementById('batch-progress-text').textContent = `${i + 1}/${lines.length} (成功 ${success}，失败 ${fail})`;
      }
      
      await saveData();
      btn.disabled = false;
      renderRecipeList();
    }
    
    // ==================== 查看详情 ====================
    function viewRecipeDetail(id) {
      const recipe = state.recipes.find(r => r.id === id);
      if (!recipe) return;
      
      document.getElementById('view-recipe-name').textContent = recipe.name;
      document.getElementById('view-recipe-body').innerHTML = `
        <div style="margin-bottom:10px;">
          <span style="padding:4px 12px; border-radius:8px; font-size:13px; margin-right:8px; background:var(--warm-beige);">${recipe.type}</span>
          <span style="font-size:14px; color:var(--text-secondary);">⏱️ ${recipe.time || '30分钟'}</span>
          <span style="font-size:14px; color:var(--text-secondary); margin-left:8px;">📊 ${recipe.difficulty || '简单'}</span>
        </div>
        
        <div class="detail-section-title">🥗 食材</div>
        <ul class="detail-list">
          ${(recipe.ingredients || ['主料 适量']).map(i => `<li>${i}</li>`).join('')}
        </ul>
        
        <div class="detail-section-title">📝 步骤</div>
        <ol class="detail-list">
          ${(recipe.steps || ['准备食材']).map(s => `<li>${s}</li>`).join('')}
        </ol>
      `;
      
      document.getElementById('modal-view').classList.add('active');
    }
    
    // ==================== 拉黑 ====================
    function blacklistRecipe(id) {
      showConfirm('确定要拉黑这道菜吗？', async () => {
        if (!state.blacklistedIds.includes(id)) {
          state.blacklistedIds.push(id);
          await saveData();
          renderWeekMenu();
          renderRecipeList();
        }
      });
    }
    
    function unblacklistRecipe(id) {
      state.blacklistedIds = state.blacklistedIds.filter(x => x !== id);
      saveData();
      renderRecipeList();
    }
    
    // ==================== 删除 ====================
    function deleteRecipe(id) {
      showConfirm('确定要删除这道菜吗？', async () => {
        state.recipes = state.recipes.filter(r => r.id !== id);
        state.blacklistedIds = state.blacklistedIds.filter(x => x !== id);
        await saveData();
        renderRecipeList();
      });
    }
    
    function clearAllRecipes() {
      showConfirm('确定要清除所有菜谱吗？此操作不可恢复！', async () => {
        state.recipes = [];
        state.blacklistedIds = [];
        state.weekMenu = [];
        await saveData();
        renderRecipeList();
        renderWeekMenu();
      });
    }
    
    // ==================== 通用确认 ====================
    let confirmCallback = null;
    
    function showConfirm(msg, callback) {
      document.getElementById('confirm-body').textContent = msg;
      confirmCallback = callback;
      document.getElementById('confirm-ok').onclick = () => {
        document.getElementById('modal-confirm').classList.remove('active');
        if (confirmCallback) confirmCallback();
      };
      document.getElementById('modal-confirm').classList.add('active');
    }
    
  </script>
</body>
</html>
